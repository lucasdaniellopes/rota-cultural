[pytest]
DJANGO_SETTINGS_MODULE = rota_cultural.core.settings
python_files = tests.py test_*.py *_tests.py
addopts =
    --verbosity=2
    --tb=short
    --strict-markers
    --disable-warnings
    --create-db
    --nomigrations
    -m "not performance"
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (database, external APIs)
    slow: Slow tests (external services, complex operations)
    routing: Tests specific to routing functionality
    geocoding: Tests specific to geocoding functionality
    gis: Tests involving PostGIS spatial operations
    django_db: Tests requiring database access
testpaths = .
django_find_project = false